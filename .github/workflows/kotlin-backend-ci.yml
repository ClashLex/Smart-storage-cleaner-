name: Kotlin Backend CI

on:
  push:
    branches: ["architecture/kotlin-first-backend"]
    paths:
      - "backend-kotlin/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/kotlin-backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend-kotlin/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/kotlin-backend-ci.yml"

jobs:
  kotlin-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Compile Kotlin backend
        run: gradle --no-daemon :backend-kotlin:compileKotlin
      - name: Run Kotlin backend tests
        run: gradle --no-daemon :backend-kotlin:test
